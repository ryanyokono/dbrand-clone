<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dbrand-Inspired Homepage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <div class="logo">dbrand</div>
      <nav class="nav-links">
        <a href="#">Shop</a>
        <a href="#">Skins</a>
        <a href="#">Cases</a>
        <a href="#">Support</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <img src="https://via.placeholder.com/1920x600?text=Hero+Image" alt="Hero Banner" />
    <div class="hero-text">
      <h1>Precision. Style. Protection.</h1>
      <a href="#" class="cta-button">Shop Now</a>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <section class="product-grid container">
    <h2>Featured Products</h2>
    <div class="grid">
      <div class="product"><img src="https://via.placeholder.com/300x300" alt="Product 1" /></div>
      <div class="product"><img src="https://via.placeholder.com/300x300" alt="Product 2" /></div>
      <div class="product"><img src="https://via.placeholder.com/300x300" alt="Product 3" /></div>
      <div class="product"><img src="https://via.placeholder.com/300x300" alt="Product 4" /></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Practice dbrand Clone. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
